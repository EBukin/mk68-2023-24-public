project:
  title: "mk68-2024-25-public"
  output-dir: _output
  render:
    - materials/mk68-01-p1-slides.qmd
    - materials/mk68-01-p2-slides.qmd
    - materials/mk68-02-slides.qmd
    - materials/mk68-02-slides-distributions.qmd
    - materials/mk68-02-slides-variance.qmd
    - materials/mk68-02-slides-quantiles.qmd
    - materials/mk68-02-slides-example-1.qmd
    - materials/mk68-03-slides.qmd
    - materials/mk68-04-slides.qmd

author:
  - name: "Eduard Bukin"
    url: "https://www.uni-giessen.de/faculties/f09/institutes/agri/policy/team/bukin"
    email: "eduard.bukin@agrar.uni-giessen.de"
    affiliations:
      - name: "Justus Liebig University Giessen"
        department: "Institute of Agricultural Policy and Market Research"
        url: "https://www.uni-giessen.de/faculties/f09/institutes/agri/policy"

subtitle: "Part 1: Statistics and Econometrics. MK68-2024/25"

course: "MK-068-EN (TM) WS2024/25. Empirical Research Methods"

institute: "Institute of Agricultural Policy and Market Research"

footer: "MK-068-EN (TM) WS2024/25. (c) Eduard Bukin"

logo: "./img/jlu-logo.png"

editor: source

format: 
  revealjs:
    theme: [default, "../eddies-theme.scss"]
    transition: fade
    slide-number: c/t
    width: 1280
    height: 800
    show-slide-number: all
    preview-links: auto
    scrollable: true
    incremental: false 
    overview: true
    menu: true
    chalkboard: true
    progress: true
    self-contained: false
    toc: true
    toc-depth: 1
    toc-title: Content
  html:
    theme:
      light: [cosmo]
      dark: [cosmo]
    mainfont: "Roboto"
    code-copy: true
    code-overflow: wrap
    toc: true

  
execute:
  freeze: auto
  
bibliography: 
  - "../references.bib"

editor_options: 
  chunk_output_type: console

  


