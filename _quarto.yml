project:
  type: website
  output-dir: _site

  # An explicit list, for two reasons.
  #
  # 1. materials/ also holds files that exist only to be {{< include >}}d into
  #    a deck (cct-2-simple.qmd, t-test.qmd, MLR.qmd, ...). They have no setup
  #    chunk of their own, so rendering them standalone fails, and they would
  #    duplicate content that is already in the parent deck.
  # 2. Two decks read data that is deliberately kept out of the repository
  #    (see .gitignore). They stay commented out until the files are in place:
  #      materials/mk68-01-p2-slides.qmd  needs  materials/data/poverty-population.csv
  #      materials/mk68-03-slides.qmd     needs  data-raw/uganda-poject/Uganda_B_E_agri and nutrition 04.06.2018.sav
  #    Their PDF versions are published for both cohorts instead.
  #
  # The decks listed are the ones the 2024/25 configuration rendered, plus the
  # prerequisites page. Rendered output is frozen under _freeze/ so a CI build
  # executes no R.
  render:
    - "index.qmd"
    - "about.qmd"
    - "slides.qmd"
    - "data.qmd"
    - "resources.qmd"
    - "cohorts/*.qmd"
    - "weeks/*.qmd"
    - "prerequisites.qmd"
    - "materials/mk68-01-p1-slides.qmd"
    # - "materials/mk68-01-p2-slides.qmd"
    - "materials/mk68-02-slides.qmd"
    - "materials/mk68-02-slides-distributions.qmd"
    - "materials/mk68-02-slides-variance.qmd"
    - "materials/mk68-02-slides-quantiles.qmd"
    - "materials/mk68-02-slides-example-1.qmd"
    # - "materials/mk68-03-slides.qmd"
    - "materials/mk68-04-slides.qmd"
    - "materials/mk68-05-slides-v2.qmd"
    - "materials/t-test-recap.qmd"
    - "materials/mk68-06-slides.qmd"
    - "materials/mk68-07-slides.qmd"

  # Quarto only copies resources it sees referenced from a rendered page.
  # The PDFs and datasets are linked from tables and download buttons, so they
  # are declared explicitly. Anchored with a leading slash on purpose: an
  # unanchored "img/**" would also match materials/img and any img/ folder
  # inside a checkout of the deployed site.
  resources:
    - "/ilias-2023-24/**"
    - "/ilias-2024-25/**"
    - "/materials/data/**"
    - "/materials/img/**"
    - "/img/**"

